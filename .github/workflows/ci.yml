name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Enforce npmjs registry
        run: npm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Enforce npmjs registry
        run: npm config set registry https://registry.npmjs.org

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run frontend lint
        run: npm --prefix client run lint

      - name: Build frontend
        run: npm --prefix client run build

      - name: Enforce bundle budgets
        run: npm --prefix client run check:bundle-budget
        env:
          BUNDLE_BUDGET_MAX_JS_KB: "1200"
          BUNDLE_BUDGET_MAX_ASSET_KB: "2000"
          BUNDLE_BUDGET_ALLOWLIST: "media/itbuilding.mp4"
